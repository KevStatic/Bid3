name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - "bridge/**"
      - "engine/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "bridge/**"
      - "engine/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check.py
      - run: python -m pytest ../engine/tests -q
        env:
          PYTHONPATH: ../engine
          PYTHONDONTWRITEBYTECODE: "1"

  board-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sketch: [Tag01, Tag02, Gateway]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
        with:
          version: "1.5.1"
      - name: Install pinned ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile hardware sketch
        run: python3 firmware/tools/build.py --sketch "${{ matrix.sketch }}"
